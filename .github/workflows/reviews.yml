name: Refresh JustDial reviews

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

concurrency: reviews

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm i
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-reviews.mjs
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Update JustDial reviews"
          git push
